[project]
name = "showmetheplayer"
version = "0.1.0"
description = "A Splot-based live camera director prototype for keeping one football player in view."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "mikolaj92" }
]
dependencies = [
  # PyPI's `splot` is an unrelated PySAL package. mikolaj92/splot publishes as
  # `splot-runtime` (import name stays `splot`). Pin the last Python runtime
  # that exports run_round / RoundResult / builtin_registry. A path source
  # would still require a sibling clone and would win over this dependency.
  "splot-runtime @ git+https://github.com/mikolaj92/splot.git@v0.2.1",
]
keywords = ["camera-director", "football", "splot", "video-routing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
showmetheplayer = "showmetheplayer.cli:main"

[project.urls]
Homepage = "https://github.com/mikolaj92/ShowMeThePlayer"
Repository = "https://github.com/mikolaj92/ShowMeThePlayer"
Issues = "https://github.com/mikolaj92/ShowMeThePlayer/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
showmetheplayer = ["profiles/player-director/*"]

name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Splot sibling
        run: git clone https://github.com/mikolaj92/splot.git ../Splot
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: uv run python -m unittest discover -s tests
      - name: Run example
        run: |
          uv run showmetheplayer decide \
            --input examples/metrics/round_1.json \
            --out /tmp/showmetheplayer-report.json \
            --state /tmp/showmetheplayer-state.json \
            --switch-out /tmp/showmetheplayer-switch.json
          uv run splot report validate /tmp/showmetheplayer-report.json

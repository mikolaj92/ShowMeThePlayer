version: 1
id: show_me_the_player_director
mode: select_one
language: en

objective:
  id: best_player_camera
  description: Select the live camera that best sees the target player.

waves:
  - id: camera_1
    kind: video
  - id: camera_2
    kind: video
  - id: camera_3
    kind: video
  - id: camera_4
    kind: video
  - id: camera_5
    kind: video
  - id: camera_6
    kind: video
  - id: camera_7
    kind: video
  - id: camera_8
    kind: video

candidate:
  kind: camera_view

signals:
  - id: visibility
    provider: candidate.value
    field: visibility
    weight: 0.30
    prefer: higher
    min: 0.55
  - id: tracking_confidence
    provider: candidate.value
    field: tracking_confidence
    weight: 0.25
    prefer: higher
    min: 0.50
  - id: occlusion
    provider: candidate.value
    field: occlusion
    weight: 0.15
    prefer: lower
  - id: sharpness
    provider: candidate.value
    field: sharpness
    weight: 0.10
    prefer: higher
  - id: face_angle
    provider: candidate.value
    field: face_angle
    weight: 0.10
    prefer: higher
  - id: latency
    provider: candidate.value
    field: latency
    weight: 0.05
    prefer: lower
  - id: current_candidate_bonus
    provider: state.is_current
    weight: 0.05
    prefer: higher

constraints:
  - id: camera_must_be_live
    provider: candidate.available
    severity: block
    reason: camera is not live
  - id: player_must_be_visible
    provider: candidate.flag
    field: player_visible
    severity: block
    reason: player is not visible

decision:
  policy: constrained_weighted_score
  tie_breaker: keep_current
  close_margin: 0.04

stability:
  policy: hysteresis
  min_improvement: 0.12
  min_hold_ms: 1000
  cooldown_ms: 2500
  prefer_current_when_close: true

uncertainty:
  when_close: keep_previous
  when_conflicting: request_more_evidence
  when_no_candidate: fallback
  when_constraints_block_all: fallback

explain:
  include_scores: true
  include_rejected_candidates: true
  include_constraints: true
  include_stability: true
